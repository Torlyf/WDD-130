<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            border: 5px solid blue;
            border-radius: 10px;
            width:35%;
            margin:30%;
            margin-top:10%;
        }
        h1, h2 {
            color: white;
            text-shadow: 2px 2px rgba(0,0,0,.75);
            text-align: center;
        }
        h3 {
            text-align: center;
            padding:10px;
        }
        #banner {
            height:300px;
            img {
                object-fit: cover;
                height:100%;
                width:100%;
            }
            #closeBtn {
                margin-left:-370px;
                margin-top:15px;
                position: absolute
            }
        }
        #myForm {
            background-color: aliceblue;
            display:grid;
            grid-template-columns: 2;
            grid-template-rows: 7;
            padding-top:20px;
            label {grid-column:1; padding-left:10px;}
            input {grid-column: 2; margin:10px;}
            #newsletter, #conditions {grid-column:1/3;}
            #submit {grid-column:1/3; text-align:center;}
        }
        #images {
            background-color: aliceblue;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: 1;
            gap: 5px;
            padding-left:10px;
            padding-top:10px;
            img {
                width:19%;
            }
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <div id="banner">
            <img alt="Jesus Feeds the 5000" src="images/jesus_feeds_5000.jpeg">
            <button type="button" id="closeBtn">X</button>
            <div style="margin-top:-100px;">
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>
            </div>

        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section id="newsletter">
                <input type="checkbox" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section id="conditions">
                <input type="checkbox" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section id="submit">
                <button type="submit">Submit</button>
            </section>
        </form>
        <section id="images">
                <img src="images/old_testament.webp">
                <img src="images/new_testament.webp">
                <img src="images/book_of_mormon.webp">
                <img src="images/doctrine_and_covenants.webp">
                <img src="images/pearl_of_great_price.webp">
        </section>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
