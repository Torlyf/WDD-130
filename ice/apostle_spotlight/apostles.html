<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background-color: #e8eced;
            font-family: Arial;
            color:#e8eced;
            text-align: center;
        }
        img {
            border: 5px solid #e8eced;
            border-radius: 50%;
            margin:.4em;
              vertical-align: middle;

        }
        img:hover {
            border-color: cadetblue;
        }

        #bg {
            border: 5px solid #020f6f;
            border-radius: 25px;
            grid-template-columns:3;
            object-fit: cover;
            margin: 0%;
            padding:20%;
            width: 100%;
            height: max-content;
        }

        #main {
            background-image: url('images/christus.webp');
            border-radius: 25px;
            grid-template-columns:3;
            margin: 10%;
            padding-top:20px;
            padding-bottom:20px;
            border: 5px solid #020f6f;
            object-fit: contain;
            background-repeat: no-repeat;
            background-attachment: local;
            background-size: cover;
            width:75%;
        }
        #presidency {
            img {
                object-fit: contain;
                width: 90px;
                height: 100px;
            }
            #oaks {
                width:120px;
                height:120px;
            }
        }
        #quorum {
            img {
                object-fit: scale-down;
                width: 60px;
                height: 60px;
            }
        }

    </style>
</head>
<body>
    <div id="main">
    <!--<img src="images/christus.webp" id="bg">-->
        <div id="presidency">
            <h1>First Presidency</h1>
            <img src="images/eyring.webp">
            <img src="images/oaks.webp" id="oaks">
            <img src="images/christofferson.webp">
        </div>
        <div id="quorum">
            <h2>Quorum of the Twelve Apostles</h2>
            <img src="images/uchtdorf.webp">
            <img src="images/bednar.webp">
            <img src="images/cook.webp">
            <img src="images/anderson.webp">
            <br>
            <img src="images/rasband.webp">
            <img src="images/stevenson.webp">
            <img src="images/renlund.webp">
            <img src="images/gong.webp">
            <br>
            <img src="images/soares.webp">
            <img src="images/kearon.webp">
            <img src="images/causse.webp">
            <img src="images/gilbert.webp">
        </div>
    </div>
</body>
</html>
